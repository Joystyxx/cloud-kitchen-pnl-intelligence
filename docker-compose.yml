services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: ck_sqlserver
    hostname: ck_sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=CloudKitchen#2025
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'CloudKitchen#2025' -C -Q 'SELECT 1' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    container_name: ck_minio
    hostname: ck_minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=ckadmin
      - MINIO_ROOT_PASSWORD=CloudKitchen#2025
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 10s
      retries: 5

volumes:
  mssql_data:
  minio_data: